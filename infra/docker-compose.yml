services:
  api:
    build: ../apps/api
    environment:
      API_DB_PATH: /data/iot_sim.db
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  api-data:
